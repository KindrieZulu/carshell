name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carshell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CARSHELL_TEST_DB: "Host=localhost;Port=5432;Database=carshell_test;Username=postgres;Password=postgres"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Apply migrations to test database
        run: |
          dotnet tool install --global dotnet-ef --version 8.*
          dotnet ef database update \
            --project CarShell.Web/CarShell.Web.csproj \
            --connection "$CARSHELL_TEST_DB"

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
